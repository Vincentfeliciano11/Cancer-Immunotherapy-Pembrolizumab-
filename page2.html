<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>The Depths Of Immunotherapy — Page 2</title>
  <style>
    :root {
      --blue: #008cff;
      --orange: #ff7a00;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      min-height: 100%;
      width: 100%;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 17% 22%, #ff850099, transparent 32%),
                  radial-gradient(circle at 82% 26%, #30b9ff94, transparent 32%),
                  linear-gradient(135deg, #0074e8, #1594ff 52%, #0060c7);
      overflow: hidden;
    }
    .nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 999;
      background: #0060cdee;
      backdrop-filter: blur(16px);
      border-bottom: 1px solid #ffffff2e;
    }
    .nav-inner {
      max-width: 1450px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -.3px;
    }
    .brand-text {
      background: linear-gradient(180deg, #fff, #ffd8ad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      border: 2px solid #fff;
      border-radius: 12px;
      background: linear-gradient(135deg, #008cff, #ff8500);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      box-shadow: 0 0 15px #00d9ff80, 0 0 12px #ff8a0066;
      transition: .2s;
    }
    .page-nav-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 0 22px #fff, 0 0 28px #00d9ff, 0 0 20px #ff8a00;
    }
    @keyframes glow {
      50% {
        text-shadow: 0 0 10px #fff, 0 0 22px #00d9ff, 0 0 28px #ff8a00;
      }
    }
    .electric {
      animation: glow 2.2s ease-in-out infinite;
      color: #fff;
    }
    .blank-page {
      min-height: 100vh;
      padding-top: 70px;
    }
    .streamlit-frame {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
      display: block;
    }
    .dna {
      position: fixed;
      font-size: 90px;
      opacity: .13;
      filter: drop-shadow(0 0 15px #fff);
      animation: float 7s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes float {
      50% {
        transform: translateY(-35px) rotate(8deg);
      }
    }
    .d1 { left: 7%; top: 25%; }
    .d2 { right: 9%; top: 55%; animation-delay: -3s; }
    .d3 { left: 45%; bottom: 12%; animation-delay: -5s; }
  </style>
</head>
<body>
  <div class="dna d1">🧬</div>
  <div class="dna d2">🧬</div>
  <div class="dna d3">🧬</div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <span>🧬</span>
        <span class="brand-text electric">The Depths Of Immunotherapy</span>
      </a>
      <a href="index.html" class="page-nav-btn">← Home</a>
    </div>
  </nav>

  <main class="blank-page">
    <iframe
      src="https://h2lzomy25z7wad5moa7tjy.streamlit.app/?embed=true"
      class="streamlit-frame"
      title="Streamlit App"
      allow='geolocation; microphone; camero; fullscreen'
      sandbox='allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts'>
    </iframe>
  </main>

  <script src="effects.js?v=20260819-uv2"></script>
</body>
</html>
